<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="referrer" content="no-referrer"><meta name="color-scheme" content="light"><meta name="robots" content="noindex,nofollow"><meta name="description" content="학생방 인테리어 고민, 데스커로 종결! 간단한 설문으로 우리 자녀에게 맞는 자녀방 구성을 추천받아 보세요."><title>DESKER | 학생방 플래너</title><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><style>@charset "UTF-8";
/* Desker 학생방 플래너 v3
   Layout/components: Toss Design (56px x-large button, 16px radius, flat layering, large touch targets)
   Colors: Desker SNS color guideline (PRIMARY #282828 warm gray scale, campaign bg #FFFADD, ATTENTION #FF5948)
   Font: Pretendard */
:root{
 --ink:#282828;--body:#515151;--muted:#7E7E7E;--soft:#969696;
 --canvas:#FFFFFF;--surface:#F0F0F0;--line:#D6D6D6;--line-soft:#E8E8E8;
 --primary:#282828;--on-primary:#FFFFFF;--primary-press:#414141;
 --hero:#FFFADD;--yellow:#FFDC1E;--hero-deep:#FFF3B8;
 --attention:#FF5948;--attention-soft:#FFEDEA;
 --radius-xl:16px;--radius-l:14px;--radius-m:10px;--radius-s:8px;
 --font:'Pretendard Variable',Pretendard,-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere}
button,input,select,textarea{font:inherit;color:inherit}
button,a,input,textarea,select{-webkit-tap-highlight-color:transparent}
button,a{touch-action:manipulation}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}
:focus-visible{outline:3px solid var(--yellow);outline-offset:3px;border-radius:6px}
a{color:inherit;text-underline-offset:4px}
h1,h2,h3,h4,p{margin:0}h1,h2,h3{line-height:1.35;letter-spacing:-.03em}
h1{font-size:36px;font-weight:700}h2{font-size:28px;font-weight:700}h3{font-size:20px;font-weight:600}
small,.small{font-size:13px}.muted{color:var(--muted)}
.eyebrow{font-size:13px;font-weight:600;color:var(--body);letter-spacing:0}
[hidden],.hidden{display:none!important}.print-only{display:none}

/* header */
.app-header{height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1120px)/2));gap:16px;position:relative;z-index:4;background:var(--canvas)}
.app-header.on-hero{background:transparent}
.brand{border:0;background:none;padding:0;display:flex;align-items:center;gap:12px;color:var(--ink)}
.brand img{height:22px;width:auto;display:block}
.brand span{font-size:14px;font-weight:600;color:var(--body);padding-left:12px;border-left:1px solid var(--line)}
.header-right{display:flex;align-items:center;gap:12px}
.test-pill{font-size:12px;font-weight:600;padding:4px 10px;background:var(--surface);color:var(--body);border-radius:99px;white-space:nowrap}
.link-btn{background:none;border:0;padding:6px 2px;font-size:14px;font-weight:600;color:var(--body);text-decoration:none}
.link-btn:hover{color:var(--ink)}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}

/* buttons (Toss xlarge: 56px / 16px radius) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 20px;min-height:48px;border:0;border-radius:var(--radius-l);background:var(--surface);color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;line-height:1.4;text-align:center}
.btn:active{transform:scale(.985)}
.btn:hover{background:#E8E8E8}
.btn.primary{background:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-press)}
.btn.accent{background:var(--yellow);color:var(--ink)}
.btn.xl{min-height:56px;border-radius:var(--radius-xl);font-size:17px;padding:0 28px}
.btn.small-btn{min-height:36px;padding:0 14px;font-size:13px;border-radius:var(--radius-s)}
.btn.wide{width:100%}.btn svg{width:18px;height:18px}
.btn.naver{background:#03A94D;color:#fff}

/* hero */
.hero{background:linear-gradient(180deg,#FDF4D3 0%,#FDF9E6 45%,#FFFDF0 75%,#FFFFFF 100%);margin-top:-64px;padding-top:64px;overflow:hidden}
.hero-inner{max-width:1120px;margin:0 auto;padding:12px 20px 56px;text-align:center}
.hero-art{display:block;width:min(100%,1040px);margin:8px auto 0}
.hero-art img{display:block;width:100%;height:auto}
.hero-art .for-mobile{display:none}
.hero-copy{margin-top:8px}
.hero-sub{font-size:20px;font-weight:500;color:var(--body);letter-spacing:-.02em}
.hero h1{font-size:clamp(34px,5vw,54px);line-height:1.25;font-weight:800;margin:8px 0 20px;letter-spacing:-.04em;color:var(--ink)}
.hero h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--yellow) 62%)}
.hero .intro{font-size:17px;line-height:1.75;color:var(--body);max-width:520px;margin:0 auto}
.hero-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:28px 0 14px}
.hero .micro{color:var(--body)}
.mood{display:flex;flex-direction:column;align-items:center;gap:4px;margin:40px auto 0;padding:24px 20px;max-width:560px;background:rgba(255,255,255,.7);border-radius:var(--radius-xl)}
.mood b{font-size:18px;font-weight:700}.mood span{font-size:15px;color:var(--body)}
.image-caption{margin-top:10px;font-size:12px;color:var(--muted)}

/* how to */
.howto{padding:48px 0 8px}
.howto h2{font-size:24px;margin-bottom:20px}
.flow{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.flow-item{background:var(--surface);border-radius:var(--radius-xl);padding:22px 20px;display:flex;flex-direction:column;gap:8px}
.flow-number{font-size:13px;font-weight:700;background:var(--ink);color:#fff;width:28px;height:28px;border-radius:50%;display:grid;place-items:center}
.flow-item h3{font-size:17px}.flow-item p{font-size:14px;color:var(--body);line-height:1.6}
.home-note{margin-top:12px;padding:18px 20px;background:var(--hero);border-radius:var(--radius-xl);font-size:14px;line-height:1.7;color:var(--body)}
.home-note strong{color:var(--ink)}

.footer{border-top:1px solid var(--line-soft);padding:24px 0 40px;margin-top:48px;display:flex;justify-content:space-between;gap:20px;font-size:12px;color:var(--muted);line-height:1.7}
.footer nav{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.footer button{background:none;border:0;text-decoration:underline;font-size:12px;padding:0;color:var(--muted);white-space:nowrap}

/* wizard */
.wizard{display:grid;grid-template-columns:240px 1fr;gap:48px;padding:32px 0 56px;align-items:start}
.wizard-aside{position:sticky;top:24px}
.wizard-aside h2{font-size:26px;margin:8px 0 20px}
.step-nav{list-style:none;padding:0;margin:0}
.step-nav li{display:flex;align-items:center;gap:12px;padding:10px 0;color:var(--soft);font-size:15px;font-weight:500}
.step-nav .circle{width:28px;height:28px;display:grid;place-items:center;border-radius:50%;background:var(--surface);font-size:12px;font-weight:700;color:var(--muted)}
.step-nav li.active{color:var(--ink);font-weight:700}
.step-nav li.active .circle{background:var(--ink);color:#fff}
.step-nav li.done .circle{background:var(--yellow);color:var(--ink)}
.step-nav li.done,.step-nav li.reach{color:var(--body)}
.step-link{all:unset;display:flex;align-items:center;gap:12px;width:100%;cursor:pointer}
.step-link:disabled{cursor:default}
.step-link:not(:disabled):hover .lbl{text-decoration:underline;text-underline-offset:4px}
.step-link:focus-visible{outline:2px solid var(--ink);outline-offset:4px;border-radius:6px}
.step-chips{display:none;position:relative;list-style:none;margin:0 -20px 14px;padding:0 20px 2px;gap:6px;overflow-x:auto;scrollbar-width:none}
.step-chips::-webkit-scrollbar{display:none}
.step-chip{display:flex;align-items:center;gap:5px;white-space:nowrap;border:1px solid var(--line);background:var(--canvas);color:var(--body);border-radius:999px;padding:6px 10px 6px 6px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.step-chip b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface);font-size:11px}
.step-chip.active{background:var(--ink);border-color:var(--ink);color:#fff}.step-chip.active b{background:#fff;color:var(--ink)}
.step-chip.done b{background:var(--yellow);color:var(--ink)}
.step-chip:disabled{color:var(--soft);border-color:var(--line-soft);cursor:default}
.side-note{font-size:13px;color:var(--muted);margin-top:20px;padding:16px;background:var(--hero);border-radius:var(--radius-l);line-height:1.7}
.form-panel{min-width:0}
.progress-track{height:4px;background:var(--surface);border-radius:4px;margin-bottom:24px;overflow:hidden}
.progress-bar{height:100%;background:var(--ink);border-radius:4px;transition:width .3s}
.step-count{font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
.form-panel h2{font-size:28px;margin-bottom:8px}
.subcopy{color:var(--body);font-size:16px;margin-bottom:28px}

.question{border:0;padding:0;margin:36px 0 0;min-width:0}
.question:first-of-type{margin-top:0}
.question legend,.q-label{display:block;font-weight:700;font-size:18px;line-height:1.5;margin-bottom:6px;padding:0}
.q-note{font-size:14px;color:var(--muted);margin:0 0 12px}
.required{display:inline-block;background:var(--attention-soft);color:#D63D2C;font-size:12px;font-weight:700;padding:1px 8px;border-radius:99px;margin-left:8px;vertical-align:2px}

.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}
.choices.single-col,.choices.long{grid-template-columns:1fr}
.choice{position:relative;display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid transparent;border-radius:var(--radius-l);padding:15px 16px;min-height:56px;font-size:16px;font-weight:500;cursor:pointer;line-height:1.5}
.choice:hover{background:#E8E8E8}
.choice input{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:none;margin:0;border:2px solid var(--line);background:#fff;border-radius:50%;display:grid;place-items:center}
.choice input[type=checkbox]{border-radius:6px}
.choice input:checked{background:var(--ink);border-color:var(--ink)}
.choice input:checked::after{content:'';width:10px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.choice:has(input:checked){background:var(--hero);border-color:var(--ink)}
.choice small{display:block;color:var(--muted);font-size:13px;font-weight:400;margin-top:2px}
.choice:has(input:focus-visible){outline:3px solid var(--yellow);outline-offset:2px}

.input-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.input-field{display:block;min-width:0;margin-top:12px}.input-row .input-field{margin-top:0}
.input-field span{font-size:14px;font-weight:600;color:var(--body);display:block;margin-bottom:6px}
input[type=number],input[type=text],input[type=url],select,textarea{width:100%;border:2px solid var(--surface);border-radius:var(--radius-l);padding:14px 16px;background:var(--surface);font-size:16px;min-height:56px;transition:border-color .15s,background .15s}
input[type=number]:focus,input[type=text]:focus,input[type=url]:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);background:#fff}
textarea{resize:vertical;min-height:96px;line-height:1.6}
select{appearance:none;-webkit-appearance:none;background-image:linear-gradient(45deg,transparent 50%,#7E7E7E 50%),linear-gradient(135deg,#7E7E7E 50%,transparent 50%);background-position:calc(100% - 22px) 50%,calc(100% - 16px) 50%;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:40px}
.inline-check{display:flex;align-items:center;gap:12px;font-size:16px;font-weight:500;margin:0 0 20px;cursor:pointer;background:var(--surface);padding:15px 16px;border-radius:var(--radius-l)}
.inline-check input{appearance:none;-webkit-appearance:none;width:22px;height:22px;flex:none;margin:0;border:2px solid var(--line);background:#fff;border-radius:6px;display:grid;place-items:center}
.inline-check input:checked{background:var(--ink);border-color:var(--ink)}
.inline-check input:checked::after{content:'';width:10px;height:6px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.inline-check.micro{background:none;padding:8px 0;font-size:13px;font-weight:400;color:var(--muted);margin-top:16px}

.form-actions{display:flex;gap:10px;margin-top:40px}
.form-actions .btn{min-height:56px;font-size:17px;border-radius:var(--radius-xl)}
.form-actions .btn:first-child{flex:0 0 auto;min-width:96px}
.form-actions .btn.primary{flex:1}
.form-error{background:var(--attention-soft);border-radius:var(--radius-l);color:#B3281A;padding:14px 16px;font-size:14px;font-weight:500;margin-top:20px}
.info-box{padding:16px 18px;background:var(--surface);border-radius:var(--radius-l);font-size:14px;color:var(--body);margin-top:16px;line-height:1.7}
.warn-box{padding:16px 18px;background:var(--hero);border-radius:var(--radius-l);font-size:14px;color:var(--body);margin:18px 0;line-height:1.7}
.review-box{margin:28px 0 0;background:var(--surface);border-radius:var(--radius-l);padding:6px 18px}
.review-box div{display:grid;grid-template-columns:96px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.review-box div:last-child{border-bottom:0}.review-box b{color:var(--muted);font-weight:500}

/* agreement (Toss-like) */
.agree{background:var(--surface);border-radius:var(--radius-l);padding:16px 18px;margin-top:12px}
.agree dl{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:12px 0;font-size:14px}
.agree dt{color:var(--muted)}.agree dd{margin:0;font-weight:600}
.agree dd.em{color:#D63D2C}
.agree .inline-check{background:#fff;margin:12px 0 0}

/* chips / badges */
.summary-chips{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 8px}
.chip{display:inline-block;padding:4px 10px;background:var(--surface);border-radius:99px;font-size:13px;font-weight:500;line-height:1.5;color:var(--body)}
.chip.light{background:#fff;border:1px solid var(--line)}
.chip.dark{background:var(--ink);color:#fff}

/* results */
.result-header{padding:36px 0 24px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.result-header h1{font-size:32px;margin-top:8px}
.result-header .subcopy{margin:10px 0 0;max-width:640px;font-size:16px}
.result-controls{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:12px 0 16px}
.result-controls select,.result-filter select{width:auto;min-width:200px;max-width:100%;font-size:15px;min-height:48px;padding:10px 40px 10px 14px;border-radius:var(--radius-m)}
.result-filter{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 20px;padding:14px 16px;background:var(--surface);border-radius:var(--radius-l)}
.select-label{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--body)}
.pill-count{font-size:16px;font-weight:700}
.result-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.result-card{background:#fff;border:2px solid var(--line-soft);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.result-card.first{border-color:var(--ink)}
.card-head{padding:22px 22px 12px}
.card-rank{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.rank-label{font-size:13px;font-weight:700;color:var(--muted)}
.first .rank-label{color:var(--ink)}
.card-head h2{font-size:22px;margin-bottom:6px}
.card-sub{font-size:14px;color:var(--muted)}
.product-gallery,.furniture-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:var(--hero);margin:6px 18px 0;padding:18px 10px 12px;border-radius:var(--radius-l);min-height:140px}
.furniture-strip{display:flex;flex-wrap:wrap;align-items:center;justify-content:center}
.product-gallery figure{margin:0;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.product-gallery img{height:104px;width:100%;object-fit:contain;display:block;mix-blend-mode:multiply}
.product-gallery figcaption{font-size:12px;color:var(--body);text-align:center;margin-top:6px;min-height:17px;font-weight:500}
.product-gallery .no-photo{height:104px;display:flex;flex-direction:column;justify-content:center;align-items:center;width:100%;color:var(--soft)}
.no-photo svg{width:44px;height:48px}.no-photo small{font-size:11px}
.gallery-note{font-size:12px;color:var(--muted);line-height:1.5;text-align:center;margin:8px 18px 0}
.card-body{padding:16px 22px;flex:1;display:flex;flex-direction:column}
.card-total{padding-bottom:14px;margin-bottom:14px;border-bottom:1px solid var(--line-soft)}
.card-total strong{display:block;font-size:28px;font-weight:800;letter-spacing:-.04em;line-height:1.35}
.card-total small{color:var(--muted);font-size:13px}
.list-price-note{margin:8px 0 0;padding:10px 12px;border-radius:10px;background:var(--hero-deep);border-left:4px solid var(--yellow);color:var(--ink);font-size:14px;line-height:1.55;letter-spacing:-.01em}
.list-price-note b{font-weight:800}
.list-price-note span{display:block;margin-top:2px;font-size:12.5px;color:var(--body);letter-spacing:-.02em}
.reasons{padding:0;list-style:none;font-size:15px;line-height:1.7;margin:0}
.reasons li{padding-left:22px;position:relative;margin-bottom:8px}
.reasons li::before{content:'✓';position:absolute;left:0;top:0;font-weight:800;color:var(--ink)}
.card-actions{padding:4px 22px 22px;display:grid;gap:8px}
.card-actions .btn{min-height:48px;font-size:15px}
.product-details{font-size:14px;border-top:1px solid var(--line-soft);margin-top:12px;padding-top:10px}
.product-details summary{cursor:pointer;font-weight:600;padding:6px 0;color:var(--body)}
.product-row{padding:10px 0;border-bottom:1px solid var(--line-soft);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.product-row .pn{font-size:14px;line-height:1.55}
.product-row code{font-size:12px;display:block;color:var(--muted);word-break:break-all;font-family:inherit}
.product-row .pp{white-space:nowrap;font-weight:700;font-size:14px}
.micro{font-size:13px;color:var(--muted);line-height:1.7}.micro b{color:var(--body)}
.source-note{font-size:13px;color:var(--muted);margin-top:14px;line-height:1.7}
.checks{padding-left:20px;font-size:14px;color:var(--body);line-height:1.8}.checks li{margin:6px 0}
.empty-state{background:var(--surface);border-radius:20px;padding:36px;max-width:760px;margin:12px auto}
.empty-state h2{margin:8px 0 14px}.empty-state p{font-size:16px;margin:10px 0}
.next-section{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:32px 0}
.next-card{padding:26px;border-radius:20px;background:var(--hero)}
.next-card h3{font-size:20px;margin:6px 0 10px}.next-card p{font-size:15px;color:var(--body);margin-bottom:18px}
.next-card .btn{margin:4px 6px 0 0}
.result-bottom{font-size:13px;color:var(--muted);padding:20px 0;border-top:1px solid var(--line-soft);line-height:1.8}
.feature-detail{padding:12px 0;border-bottom:1px solid var(--line-soft);font-size:15px}
.feature-detail p,.feature-detail small{font-size:13px;color:var(--muted)}
.pending-link{font-size:13px;color:var(--muted);background:var(--surface);border-radius:var(--radius-s);padding:9px 12px}

/* dialog */
dialog{border:0;border-radius:24px;max-width:720px;width:calc(100% - 24px);max-height:90vh;padding:0;color:var(--ink);background:#fff;overscroll-behavior:contain}
dialog::backdrop{background:rgba(40,40,40,.55)}
.modal-content{padding:28px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.modal-head h2{font-size:22px}
@media(min-width:741px){.modal-head{position:sticky;top:0;z-index:3;background:#fff;margin:-28px -28px 16px;padding:22px 28px 14px;border-radius:24px 24px 0 0;cursor:move;touch-action:none;user-select:none}.modal-head .close{cursor:pointer}dialog.dragging{box-shadow:0 18px 48px rgba(40,40,40,.28)}}
.close{border:0;border-radius:50%;width:36px;height:36px;background:var(--surface);font-size:20px;line-height:1;flex:none}
.modal-back{border:0;border-radius:50%;width:36px;height:36px;background:var(--surface);font-size:18px;font-weight:700;line-height:1;flex:none;cursor:pointer;color:var(--ink)}
.modal-back:hover,.close:hover{background:var(--line-soft)}.modal-back+h2{flex:1;min-width:0}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.detail-title{font-size:18px;margin:24px 0 8px}
.shopping-row{padding:16px 0;border-bottom:1px solid var(--line-soft);display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.shopping-row code{display:block;font-size:12px;color:var(--muted);font-family:inherit}.shopping-row strong{font-size:15px}
.shopping-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.status{font-size:12px;color:var(--muted);margin-top:4px}
.qr-area{text-align:center;padding:20px;border-radius:var(--radius-l);background:var(--surface)}
.qr-area svg{width:240px;height:240px;max-width:100%;background:#fff;padding:6px}.qr-area p{font-size:13px;margin:10px 0}
.codebox{padding:12px;background:var(--surface);border-radius:var(--radius-s);font-size:13px;word-break:break-all}
.demo-grid{display:grid;grid-template-columns:1fr;gap:8px;margin-top:16px}
.demo-grid .btn{justify-content:flex-start;text-align:left;padding:14px 16px;min-height:64px}
.rule-source{font-size:14px;color:var(--body);line-height:1.8}
.report{background:#fff;color:var(--ink)}.report h3{font-size:20px;margin:16px 0}
.report-table{border-collapse:collapse;width:100%;font-size:14px;margin:14px 0}
.report-table th,.report-table td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line-soft);vertical-align:top}
.report-table th{background:var(--surface);font-weight:600}.report-table .money{text-align:right;white-space:nowrap}
.report-kv{display:grid;grid-template-columns:110px 1fr;font-size:14px;gap:8px;padding:14px 0;border-top:1px solid var(--line)}
.report-kv dt{color:var(--muted)}.report-kv dd{margin:0}
.report .product-gallery{margin:12px 0;grid-template-columns:repeat(5,minmax(0,1fr))}.report .product-gallery img,.report .no-photo{height:88px}
.modal-content>.product-gallery{margin-left:0;margin-right:0}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);width:max-content;background:var(--ink);color:#fff;padding:14px 20px;border-radius:var(--radius-l);font-size:15px;font-weight:500;z-index:20}
.no-break{white-space:nowrap}

@media(max-width:940px){
 .wizard{grid-template-columns:200px 1fr;gap:28px}
 .result-grid{grid-template-columns:1fr 1fr}
}

 body{font-size:16px}
 .app-header{height:56px;padding:0 20px}.brand span{display:none}.brand img{height:20px}
 .hero{margin-top:-56px;padding-top:56px}

 .hero-art .for-desktop{display:none}.hero-art .for-mobile{display:block}
 .hero-art{width:min(100%,420px)}
 .hero-sub{font-size:17px}
 .hero h1{font-size:34px}
 .hero .intro{font-size:16px}
 .hero-actions{flex-direction:column}.hero-actions .btn{width:100%}
 .mood{margin-top:28px}
 .flow{grid-template-columns:1fr}
 .footer{display:block}.footer nav{margin-top:12px}
 .wizard{display:block;padding:20px 0 40px}.wizard-aside{display:none}.step-chips{display:flex}
 .form-panel h2{font-size:24px}
 .question legend,.q-label{font-size:17px}
 .choices{grid-template-columns:1fr}
 .input-row{grid-template-columns:1fr}
 .form-actions{margin-top:32px}

 .result-filter{display:grid}.result-filter select{width:100%}
 .card-actions{grid-template-columns:1fr 1fr}.card-actions .btn:last-child{grid-column:1/-1}

 .report-kv{grid-template-columns:84px 1fr}
 .report .product-gallery{grid-template-columns:repeat(3,minmax(0,1fr))}
 .empty-state{padding:24px}

function shop(i){selected=i;const c=result.results[i];openModal('온라인 구매 안내',`<p class="subcopy">추천 구성의 제품코드와 옵션을 확인한 뒤 판매처에서 주문해 주세요. 한 번에 장바구니에 담거나 결제하는 기능은 아닙니다.</p><div class="warn-box">${won(c.amount)}은 제공받은 소비자가 합계입니다. 링크의 현재 판매가·배송비·재고는 판매처에서 다시 확인해 주세요. ${c.keys.includes('BEDSET')?'매트리스 포함 침대세트의 구성인지 특히 확인하세요.':c.keys.includes('BEDF')?'매트리스는 포함되어 있지 않습니다. 보유 매트리스 호환성을 확인하세요.':'이 구성에는 침대·매트리스가 포함되어 있지 않습니다.'}</div>${aggregate(c.keys).map(([k,q])=>`<div class="shopping-row"><div><strong>${esc(P[k][1])}${q>1?' × '+q:''}</strong><code>${esc(P[k][0])} · ${won(P[k][2]*q)}</code><p class="status">${LINKS[k]?'제품코드로 확인한 공식몰 상품 페이지':'직접 구매주소 연결 전 · 공식몰과 제품코드로 확인'}</p></div><div class="shopping-actions">${btn('코드 복사','copy-code','small-btn',`data-key="${k}"`)}<a class="btn small-btn ${LINKS[k]?'primary':''}" href="${esc(LINKS[k]||CONF.shopUrl)}" target="_blank" rel="noopener noreferrer">${LINKS[k]?'상품 확인 ↗':'공식몰 안내 ↗'}</a></div></div>`).join('')}<div class="modal-actions">${btn('전체 구매목록 복사','copy-list')}${btn('매장 상담표로 확인','consult','primary',`data-i="${i}"`)}</div><p class="source-note">정확한 SKU별 구매주소가 없는 품목을 다른 제품 페이지로 임의 연결하지 않았습니다.</p>`);}
function identifier(c){let h=2166136261;const str=JSON.stringify({a:{...E.normalize(publicA()),other:''},id:c?.id||'',v:DATA_VERSION});for(const ch of str)h=Math.imul(h^ch.charCodeAt(0),16777619);return 'DK-'+(h>>>0).toString(16).toUpperCase().padStart(8,'0');}
function reportHTML(c){return `<section class="report"><div class="eyebrow">DESKER · STUDENT ROOM CONSULTATION</div><h2>우리 자녀방 상담표</h2><p class="micro">구성 식별번호 ${identifier(c)} · ${new Date().toLocaleDateString('ko-KR')} · ${DATA_VERSION}<br>이 번호는 서버 조회번호가 아닙니다. 이 화면·저장 파일 또는 결과 링크를 함께 보여주세요.</p><dl class="report-kv"><dt>자녀 / 인원</dt><dd>${E.AGE[a.age]||'미입력'} · ${a.targetCount==='multiple'?'다인 구성 상담':'1인 구성'} / 전체 자녀 ${a.count==='3'?'3명 이상':a.count+'명'}</dd><dt>구매 계기</dt><dd>${a.reason.map(k=>E.REASONS[k]).join(' · ')}</dd><dt>방 환경</dt><dd>${roomLabel()} · ${a.roomKnown==='unknown'?'방 크기 모름':`${a.roomKnown==='approx'?'대략 ':''}${a.width||'?'} × ${a.depth||'?'}cm`} · 천장 ${a.ceiling||'미확인'}${a.ceiling?'cm':''} · 책상 배치 폭 ${a.wallWidth||'미확인'}${a.wallWidth?'cm':''}</dd><dt>설치 제약</dt><dd>${a.constraints.map(k=>E.CONSTRAINTS[k]).join(' · ')||'미선택'} / 벽고정 ${{yes:'가능 응답',no:'불가 응답',unknown:'확인 필요'}[a.wall]}</dd><dt>유지할 가구</dt><dd>${a.kept.map(k=>({desk:'책상',bed:'침대',mattress:'매트리스',ward:'옷장',storage:'수납장',chair:'의자'})[k]).join(' · ')||'없음'}</dd><dt>필수 품목</dt><dd>${a.unknownItems?'필요 품목 탐색':a.mandatory.map(k=>E.ITEMS[k]).join(' · ')}</dd><dt>우선순위</dt><dd>${E.ITEMS[a.priority]||'전체 함께 고려'}</dd><dt>중요한 요소</dt><dd>${a.needs.map(k=>E.NEEDS[k]).join(' · ')}</dd><dt>예산</dt><dd>${budgetLabel()}${a.cap?' / 상한 '+a.cap+'만원':''}${a.allowLower?' / 낮은 예산 대안 허용':''}</dd><dt>추가 요청</dt><dd>${esc(a.other)||'없음'}</dd></dl>${c?`<h3>선택 구성 · ${cTitle(c)}</h3><p class="micro">${esc(c.baseId)} 기반 · ${c.partial?'미선택 품목을 제외한 부분구성':'패키지 구성'}${c.changedChair?' · 의자 변경 반영':''}</p><table class="report-table"><thead><tr><th>제품명 / 코드</th><th>수량</th><th class="money">금액</th></tr></thead><tbody>${aggregate(c.keys).map(([k,q])=>`<tr><td>${esc(P[k][1])}<br><span class="micro">${P[k][0]}</span></td><td>${q}</td><td class="money">${won(P[k][2]*q)}</td></tr>`).join('')}<tr><th colspan="2">소비자가 합계 (VAT 포함)</th><th class="money">${won(c.amount)}</th></tr></tbody></table><h3>추천 이유</h3><ul class="checks">${c.reasons.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h3>상담·설치 확인 사항</h3><ul class="checks">${c.checks.map(x=>`<li>□ ${esc(x)}</li>`).join('')}<li>□ 최종 가격·색상·제품코드·재고·배송일·추가 설치비 확인</li><li>□ 출입문·창문·서랍 열림·의자 이동 동선과 전체 배치 확인</li></ul>`:`<h3>맞춤 상담이 필요합니다</h3><p>${esc(result?.consultOnly||'필수 품목과 예산·설치 조건을 충족하는 등록 조합이 없어, 응답을 바탕으로 구성을 상담해 주세요.')}</p>`}<p class="micro">이 상담표는 확정 견적서가 아닙니다. 상담 접수로 처리되거나 매장에 자동 전달되지 않습니다. 제품가이드 중 내부 전용 자료나 신청자 리포트 원문은 고객 결과에 포함하지 않았습니다.</p></section>`;}

async function copyText(t){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(t);}else{const ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw Error('copy');}toast('복사했어요.');}catch(e){openModal('직접 복사해 주세요',`<textarea readonly rows="7">${esc(t)}</textarea>`);}}

function publicUrl(raw){try{const u=new URL(raw);if(u.protocol!=='https:'||u.username||u.password)return null;const h=u.hostname;if(h==='localhost'||h.endsWith('.local')||h.endsWith('.localhost')||/^127\.|^0\.|^10\.|^192\.168\.|^169\.254\.|^172\.(1[6-9]|2[0-9]|3[01])\./.test(h)||h==='[::1]'||!h.includes('.'))return null;u.hash='';return u;}catch(e){return null;}}
function autoBase(){return publicBase||CONF.publicBase||(publicUrl(location.href)?location.href.split('#')[0]:'');}
const PACK_FIELDS=[['age',Object.keys(E.AGE)],['count',['1','2','3']],['targetCount',['one','multiple']],['reason',Object.keys(E.REASONS),'mask'],['room',Object.keys(E.ROOM)],['roomKnown',['exact','approx','unknown']],['width'],['depth'],['ceiling'],['wallWidth'],['constraints',Object.keys(E.CONSTRAINTS),'mask'],['wall',['yes','no','unknown']],['items',Object.keys(E.ITEMS),'mask'],['mandatory',Object.keys(E.ITEMS),'mask'],['priority',['',...Object.keys(E.ITEMS)]],['kept',['desk','bed','mattress','ward','storage','chair','other'],'mask'],['scope',['needed','full']],['unknownItems',null,'bool'],['mat',['new','keep','unknown']],['needs',Object.keys(E.NEEDS),'mask'],['use',['paper','digital','mixed']],['motion',['any','want','must','no']],['storageType',['any','books','clothes','small','mirror'],'stmask'],['chair',['auto','RNG','ALR','IBL','headrest','height','allage']],['budget',['u50','50','100','150','200','250','300','unknown']],['cap'],['allowLower',null,'bool'],['useSel',['paper','digital','both','together'],'mask'],['monitor',['','yes','no']],['colorPref',['','any','WWWW','OSWW','OSOS']],['channel',['online','store','both']]];
function encodePayload(){const packed=PACK_FIELDS.map(([k,opts,type])=>type==='stmask'?-1-(a[k]||[]).reduce((m,v)=>m|(1<<opts.indexOf(v)),0):type==='mask'?(a[k]||[]).reduce((m,v)=>m|(1<<opts.indexOf(v)),0):type==='bool'?(a[k]?1:0):opts?opts.indexOf(a[k]):a[k]);return btoa(JSON.stringify([DATA_VERSION,selected,...packed])).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function decodePayload(s){if(s.length>5000)throw Error('too large');const x=JSON.parse(atob(s.replace(/-/g,'+').replace(/_/g,'/')));if(!Array.isArray(x)||x[0]!==DATA_VERSION||x.length!==PACK_FIELDS.length+2)throw Error('version or shape');const decoded={};PACK_FIELDS.forEach(([k,opts,type],i)=>{const v=x[i+2];decoded[k]=type==='stmask'?(v<0?opts.filter((_,j)=>((-1-v)&(1<<j))!==0):opts[v]):type==='mask'?opts.filter((_,j)=>(v&(1<<j))!==0):type==='bool'?v===1:opts?opts[v]:v;});return {v:x[0],i:x[1],a:E.normalize(decoded)};}
function qrSvg(text){const qr=new LocalQRCode(-1,LocalQRLevel.M);qr.addData(text);qr.make();const n=qr.getModuleCount(),s=n+8;let d='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(qr.isDark(y,x))d+=`M${x+4},${y+4}h1v1h-1z`;return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s} ${s}" shape-rendering="crispEdges" role="img" aria-label="QR 코드"><rect width="${s}" height="${s}" fill="white"/><path d="${d}" fill="black"/></svg>`;}
let generatedQR='',generatedUrl='';
function share(){const base=autoBase();openModal('결과 링크와 QR',`<p class="subcopy">같은 결과를 링크나 QR로 매장에 전달할 수 있어요. 링크에는 자녀 나이, 예산, 방 크기와 선택한 답변이 담기고, 이름·연락처와 직접 적은 요청은 들어가지 않아요.</p><label class="input-field"><span>공개된 플래너 주소 (https)</span><input id="share-base" type="url" placeholder="실제 배포 주소를 입력하세요" value="${esc(base)}"></label><div class="modal-actions">${btn('링크 · QR 만들기','make-share','primary')}</div><div id="qr-output"></div><p class="source-note">링크를 받은 사람은 답변 내용을 볼 수 있어요.</p>`);if(base)makeShare();}
function makeShare(){const b=publicUrl($('#share-base').value);if(!b){toast('외부에서 열 수 있는 https 주소를 입력해 주세요.');return;}publicBase=b.href;const u=b.href+'#r='+encodePayload();try{generatedQR=qrSvg(u);generatedUrl=u;$('#qr-output').innerHTML=`<div class="qr-area">${generatedQR}<p>스캔하면 선택한 구성과 답변이 열려요</p></div><div class="modal-actions">${btn('링크 복사','copy-generated')}${btn('QR 이미지 저장','save-qr')}</div>`;}catch(e){$('#qr-output').innerHTML='<div class="warn-box">주소가 길어 QR 생성이 어렵습니다. 링크 복사 또는 상담표 HTML 저장을 이용해 주세요.</div>';generatedUrl=u;}}
function deploy(){openModal('QR 배포 도구',`<p class="subcopy">이 HTML을 공개 HTTPS 주소에 게시한 뒤, 주소를 입력하면 고객용 설문 QR을 만들 수 있습니다. 지금 도구가 웹사이트를 자동 게시하는 것은 아닙니다.</p><label class="input-field"><span>배포한 설문 웹주소</span><input id="deploy-base" type="url" placeholder="실제 배포 주소" value="${esc(autoBase())}"></label><label class="input-field" style="margin-top:15px"><span>매장·캠페인 구분 코드 (선택, 영문·숫자·하이픈)</span><input id="store-code" type="text" maxlength="40" placeholder="예: STORE-01"></label><div class="modal-actions">${btn('설문 진입 QR 만들기','make-entry','primary')}</div><div id="qr-output"></div><div class="warn-box">실제 배포 전: 제품·묶음 판매코드별 네이버 구매주소 매핑, 최신 가격 확인, 설치 규칙 승인, 실제 모바일 QR 테스트가 필요합니다. 고객 응답 수집·상담 자동 접수·관리자 조회·분석 통계는 별도 서버 연결 전입니다.</div>`);}
function makeEntry(){const u=publicUrl($('#deploy-base').value);if(!u){toast('공개 HTTPS 웹주소를 입력해 주세요. 로컬 파일·내부 IP는 사용할 수 없어요.');return;}const code=$('#store-code').value.trim();if(code&&!/^[a-zA-Z0-9-]{1,40}$/.test(code)){toast('매장 코드는 영문·숫자·하이픈만 사용해 주세요.');return;}if(code)u.searchParams.set('store',code);publicBase=u.href;generatedUrl=u.href;try{generatedQR=qrSvg(generatedUrl);$('#qr-output').innerHTML=`<div class="qr-area">${generatedQR}<p>고객이 스캔하면 설문 첫 화면으로 이동합니다.</p></div><div class="codebox">${esc(generatedUrl)}</div><div class="modal-actions">${btn('주소 복사','copy-generated')}${btn('QR 이미지 저장','save-qr')}</div><p class="micro">매장 코드는 URL 구분값으로만 포함됩니다. 방문·응답 통계는 자동 집계되지 않습니다.</p>`;}catch(e){toast('QR 생성에 실패했어요. 더 짧은 공개 주소를 사용해 주세요.');}}
function about(){openModal('추천 기준과 현재 범위',`<p class="subcopy">기존 확정 조합을 바탕으로 만든 규칙 기반 시제품입니다. 아래 추가 규칙은 실제 운영 전 승인·검증이 필요한 설계안입니다.</p><h3 class="detail-title">기존 기준 유지</h3><p class="rule-source">S/A/B/C/D의 102개 등록 조합, 57개 제품코드와 소비자가를 사용합니다. 원본 조합은 바꾸지 않고 별도로 보관하며 5·6단 일치와 매트리스 포함 여부를 확인합니다.</p><h3 class="detail-title">이번에 추가한 추천 규칙</h3><p class="rule-source">① 필수 품목·책상 형태·예산·벽고정·확인된 천장 기준을 먼저 필터링합니다.<br>② ‘필요한 품목만’ 선택 시 등록 조합에서 미선택 품목을 제외하고 ‘부분구성’으로 구분합니다.<br>③ 의자는 연령별 선호 경향 또는 고객 선택으로 바꾸며 금액을 재계산합니다.<br>④ 수납·모션·디지털 학습 등 응답에 맞는 구조에 점수를 주고, 의자만 다른 중복안은 줄여 최대 3개를 제안합니다.<br>⑤ 기준을 통과한 결과가 1~2개라면 그 수만 보여주며, 없으면 상담으로 안내합니다.</p><h3 class="detail-title">자료를 적용하는 방식</h3><p class="rule-source">인수인계 문서는 조합의 기준, 제품가이드는 기능·제약의 근거, 래플·얼리버드 리포트는 설문과 고객 상황을 이해하는 참고 자료로 활용했습니다. 리포트의 인기 비율을 개인 적합도 확률로 바꾸지 않았습니다.</p><h3 class="detail-title">자동으로 확정하지 않는 것</h3><p class="rule-source">전체 방 배치·서랍과 방문의 간섭, 벽고정 연결 예외, 제품별 신체 적합성, 최신 실판매가·재고, 맞춤 상담 접수, 구매 전환 통계. W600 일반 책장 6단의 가이드 단위 오기는 임의 보정하지 않고 상담 확인으로 남겼습니다.</p><div class="info-box">추천 계산은 브라우저에서 처리하고, 완료한 응답과 추천 결과는 이름·연락처 없이 익명으로 저장되어 통계에 활용됩니다. ‘이 기기에 저장’은 이 기기에서 답변을 다시 불러오는 기능이며, 링크 공유는 고객이 직접 요청할 때 생성합니다.</div>`);}

function parseMappings(text){
 const rows=text.trim().split(/\r?\n/),pending={},issues=[],skipped=[];let accepted=0;
 for(let i=0;i<rows.length;i++){
  const r=rows[i].trim();if(!r)continue;
  const cells=r.includes('\t')?r.split('\t'):r.split(',');const code=(cells[0]||'').replace(/^"|"$/g,'').trim().toUpperCase();const url=(cells[1]||'').replace(/^"|"$/g,'').trim();
  if(i===0&&(/코드|CODE/i.test(code))&&!SALE_CODES.has(code))continue;
  if(!url){skipped.push(`${i+1}행: 주소 미입력 ${code}`);continue;}
  if(!SALE_CODES.has(code)){skipped.push(`${i+1}행: 현재 추천 목록 외 코드 ${code}`);continue;}
  const valid=validNaver(url);if(!valid){issues.push(`${i+1}행: ${code} 상품 상세주소 확인 필요`);continue;}
  if(pending[code]&&pending[code]!==valid){issues.push(`${i+1}행: ${code} 서로 다른 주소 중복`);continue;}
  pending[code]=valid;accepted++;
 }
 return {pending,issues,skipped,accepted};
}

function trimProductImg(img){
 if(img.dataset.trim)return;img.dataset.trim='1';
 const go=()=>{try{
  const w=img.naturalWidth,h=img.naturalHeight;if(!w||!h)return;
  const sc=Math.min(1,480/Math.max(w,h)),cw=Math.max(1,Math.round(w*sc)),ch=Math.max(1,Math.round(h*sc));
  const c=document.createElement('canvas');c.width=cw;c.height=ch;const g=c.getContext('2d',{willReadFrequently:true});g.drawImage(img,0,0,cw,ch);
  const d=g.getImageData(0,0,cw,ch).data,bg=[d[0],d[1],d[2],d[3]];
  const blank=i=>d[i+3]<24||(bg[3]>200&&Math.abs(d[i]-bg[0])<14&&Math.abs(d[i+1]-bg[1])<14&&Math.abs(d[i+2]-bg[2])<14);
  let x0=cw,y0=ch,x1=-1,y1=-1;
  for(let y=0;y<ch;y++)for(let x=0;x<cw;x++)if(!blank((y*cw+x)*4)){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;}
  if(x1-x0<10||y1-y0<10)return;
  x0=Math.max(0,x0-3);y0=Math.max(0,y0-3);x1=Math.min(cw-1,x1+3);y1=Math.min(ch-1,y1+3);
  const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;o.getContext('2d').drawImage(c,x0,y0,o.width,o.height,0,0,o.width,o.height);
  img.src=o.toDataURL('image/png');
 }catch(e){}};
 if(img.complete&&img.naturalWidth)go();else img.addEventListener('load',go,{once:true});
}
new MutationObserver(()=>document.querySelectorAll('.product-gallery img:not([data-trim])').forEach(trimProductImg)).observe(document.body,{childList:true,subtree:true});
